[pytest]
# Configuration for pytest

# Directories to search for tests
testpaths = tests

# Python files to search for tests
python_files = test_*.py

# Python functions to search for tests
python_functions = test_*

# Python classes to search for tests
python_classes = Test*

# Add current directory to Python path
pythonpath = .

# Verbose output with short tracebacks and color
addopts = -v --tb=short --color=yes

# Disable warnings
filterwarnings = 
    ignore::DeprecationWarning

# Markers for test categorization
markers = 
    slow: mark tests as slow (deselect with '-m "not slow"')
    integration: mark tests as integration tests
    unit: mark tests as unit tests
    api: mark tests as API tests

# Console output formatting
console_output_style = progress

# Asyncio support
asyncio_mode = auto

# Timeout for tests (in seconds)
testpaths_timeout = 30
